name: Build release downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'nsis-3.11-setup.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'nsis-3.11'
          curl.exe --fail --location --output $installer 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed' }
          # Digest from microsoft/winget-pkgs: manifests/n/NSIS/NSIS/3.11/NSIS.NSIS.installer.yaml.
          $expected = '38D49F8FE09B1C332B01D0940E57B7258F4447733643273A01C59959AD9D3B0A'
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($actual -ne $expected) { throw "NSIS installer checksum mismatch: $actual" }
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$directory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $directory 'makensis.exe'
          if ((& $compiler /VERSION) -ne 'v3.11') { throw 'Unexpected NSIS compiler version' }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux build and rendering libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev xvfb xauth openbox
      - name: Install the verified Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
          rustc --version --verbose
      - name: Check and build
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
      - name: Verify Linux native rendering
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -e -c '
            openbox &
            for scenario in theme text marquee resize snapping long-text text-token text-tabs; do
              LIBGL_ALWAYS_SOFTWARE=1 cargo run --locked --example verify_native -- target/verification/release "$scenario" 960x640
            done
          '
      - name: Verify macOS native rendering
        if: runner.os == 'macOS'
        run: |
          for scenario in theme text marquee resize snapping long-text text-token text-tabs quit; do
            cargo run --locked --example verify_native -- target/verification/release "$scenario" 960x640
          done
      - name: Package and verify installers and archives
        run: python packaging/package.py '${{ matrix.platform }}' '${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: target/release-downloads/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
