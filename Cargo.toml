[package]
name = "papercraft"
version = "0.3.0"
edition = "2024"
description = "A local design canvas built in Rust and egui."
repository = "https://github.com/slyim/papercraft"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18.1"
tempfile = "3"
getrandom = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63", features = ["menu"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
