[package]
name = "crumbs"
version = "0.1.0"
edition = "2024"
description = "A local design canvas built in Rust and egui."
repository = "https://github.com/slyim/crumbs"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
